services:
  - type: web
    name: smart-drive
    env: python
    plan: free
    branch: main
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r campus_transport/requirements.txt && cd campus_transport && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_demo
    startCommand: gunicorn --chdir campus_transport --log-level debug campus_transport.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        value: ""
      - key: DATABASE_URL
        value: ""
      - key: DJANGO_ALLOWED_HOSTS
        value: "smartdrive-4.onrender.com,127.0.0.1,localhost"
      - key: GOOGLE_MAPS_API_KEY
        value: ""

databases:
  - name: smart-drive-db
    environment: postgresql
    plan: free
